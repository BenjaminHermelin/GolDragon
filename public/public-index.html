<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GolDragon</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#05070a; --bg2:#0b0f16; --panel:#0e131c; --line:#1c2634;
  --text:#e7edf5; --sub:#8695ab; --p1:#22d3ee; --p2:#f472b6; --accent:#8b5cf6;
  --danger:#ef4444; --good:#22c55e;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#05070a; --bg2:#0b0f16; }
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
html[dir="rtl"] body{direction:rtl;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Rajdhani',system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden; -webkit-user-select:none; user-select:none;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
#app{position:relative; width:100vw; height:100vh; height:100dvh;}
.screen{
  position:absolute; inset:0; display:none; flex-direction:column;
  background:
    radial-gradient(circle at 20% -10%, #10182655 0%, transparent 50%),
    radial-gradient(circle at 80% 110%, #1a0f2655 0%, transparent 50%),
    var(--bg);
  overflow-y:auto;
}
.screen.active{display:flex;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 28px; border-bottom:1px solid var(--line); flex-shrink:0;
}
.brand{font-size:22px; font-weight:700; letter-spacing:2px; color:var(--text);}
.brand span{color:var(--accent);}
.iconbtn{
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  padding:8px 14px; border-radius:6px; font-size:14px; cursor:pointer; font-family:inherit;
  letter-spacing:.5px;
}
.iconbtn:hover{border-color:var(--accent);}
.iconbtn:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:22px; text-align:center;}
h1.hero{font-size:clamp(38px,7vw,68px); margin:0; font-weight:700; letter-spacing:3px;}
h1.hero .sub{display:block; font-size:clamp(14px,2vw,18px); color:var(--sub); letter-spacing:6px; margin-top:10px; font-weight:500;}
.menuBtns{display:flex; flex-direction:column; gap:12px; width:min(320px,80vw);}
.bigbtn{
  background:linear-gradient(180deg,#141c29,#0d1219); border:1px solid var(--line); color:var(--text);
  padding:16px 20px; font-size:18px; border-radius:8px; cursor:pointer; font-family:inherit;
  letter-spacing:2px; font-weight:600; transition:border-color .15s, transform .15s;
}
.bigbtn:hover{border-color:var(--accent); transform:translateY(-1px);}
.bigbtn.primary{background:linear-gradient(180deg,#8b5cf6,#6d28d9); border-color:#6d28d9;}
.txtfield{
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  padding:14px 16px; font-size:16px; border-radius:8px; font-family:inherit; width:100%;
  box-sizing:border-box; letter-spacing:1px;
}
.txtfield:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
.fieldLabel{font-size:12px; color:var(--sub); letter-spacing:1px; text-align:left; margin-bottom:-10px;}
.langRow{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
.langChip{
  padding:7px 14px; border-radius:20px; border:1px solid var(--line); background:var(--panel);
  color:var(--sub); cursor:pointer; font-family:inherit; font-size:14px; letter-spacing:1px;
}
.langChip.active{border-color:var(--p1); color:var(--p1);}
.sectionTitle{font-size:14px; letter-spacing:3px; color:var(--sub); margin:0 0 4px;}
.grid{display:grid; gap:14px; padding:20px 28px 100px; flex:1; overflow-y:auto;}
.agentGrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
.mapGrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px;
  cursor:pointer; text-align:left; transition:border-color .15s, transform .1s; position:relative;
}
html[dir="rtl"] .card{text-align:right;}
.card:hover{transform:translateY(-2px);}
.card.picked{border-color:var(--p1); box-shadow:0 0 0 1px var(--p1) inset;}
.card.picked2{border-color:var(--p2); box-shadow:0 0 0 1px var(--p2) inset;}
.swatch{width:100%; height:64px; border-radius:6px; margin-bottom:10px;}
.agentName{font-weight:700; font-size:17px;}
.agentRole{font-size:12px; color:var(--sub); letter-spacing:1px; margin-bottom:6px;}
.abilityName{font-size:12px; color:var(--accent); font-weight:600;}
.abilityDesc{font-size:12px; color:var(--sub); margin-top:2px; line-height:1.4;}
.mapImg{width:100%; height:110px; border-radius:6px; margin-bottom:10px; position:relative; overflow:hidden;}
.mapName{font-weight:700; font-size:18px;}
.mapDesc{font-size:12px; color:var(--sub);}
.pickRow{display:flex; gap:10px; padding:14px 28px; border-top:1px solid var(--line); align-items:center; flex-wrap:wrap; flex-shrink:0;}
.pickTag{font-size:13px; padding:6px 12px; border-radius:6px; border:1px solid var(--line);}
.pickTag.p1{color:var(--p1); border-color:var(--p1);}
.pickTag.p2{color:var(--p2); border-color:var(--p2);}
.spacer{flex:1;}
.weaponList{display:flex; flex-direction:column; gap:8px; padding:16px 28px; overflow-y:auto; flex:1;}
.wRow{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px;}
.wName{width:150px; font-weight:600;}
.wStat{font-size:12px; color:var(--sub); width:90px;}
.wCost{width:80px; font-size:13px; color:var(--good); text-align:right;}
html[dir="rtl"] .wCost{text-align:left;}
.wKey{width:34px; height:34px; border-radius:6px; background:#161d29; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:13px;}
#gameScreen{background:#000;}
#viewport{position:absolute; inset:0;}
.hud{position:absolute; inset:0; pointer-events:none;}
.hudSide{position:absolute; top:0; bottom:0; width:50%; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px));}
.hudSide.left{left:0;}
.hudSide.right{right:0; text-align:right;}
.hpWrap{display:flex; align-items:center; gap:8px;}
.hudSide.right .hpWrap{flex-direction:row-reverse;}
.hpBarBg{flex:1; height:16px; background:#1a1f2b; border-radius:4px; overflow:hidden; border:1px solid var(--line);}
.hpBarFill{height:100%; background:linear-gradient(90deg,#22c55e,#4ade80); transition:width .15s;}
.hpNum{font-size:13px; width:34px; font-weight:700;}
.pName{font-size:13px; letter-spacing:1px; margin-bottom:4px; font-weight:700;}
.wpInfo{font-size:12px; color:var(--sub); margin-top:6px;}
.abilBox{margin-top:6px; font-size:12px; padding:6px 10px; border-radius:6px; background:#ffffff10; display:inline-block;}
.centerHud{position:absolute; top:14px; left:50%; transform:translateX(-50%); text-align:center;}
.scoreRow{font-size:22px; font-weight:700; letter-spacing:4px;}
.scoreRow .p1t{color:var(--p1);} .scoreRow .p2t{color:var(--p2);}
.roundMsg{font-size:15px; color:var(--sub); margin-top:2px;}
.divider{position:absolute; left:50%; top:0; bottom:0; width:2px; background:#ffffff22; transform:translateX(-1px);}
.overlayMsg{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
  background:#00000090; pointer-events:none;
}
.overlayMsg .big{font-size:44px; font-weight:700; letter-spacing:3px;}
.buyBar{position:absolute; bottom:0; left:0; right:0; padding:10px 16px; background:#000000b0; border-top:1px solid var(--line); display:flex; justify-content:space-between; pointer-events:none;}
.buyCol{width:44%; font-size:12px;}
.buyCol .t{font-weight:700; margin-bottom:4px; letter-spacing:1px;}
.buyList{display:flex; flex-wrap:wrap; gap:4px;}
.buyChip{border:1px solid var(--line); border-radius:4px; padding:2px 6px; background:#0e131c;}
footer.credit{font-size:11px; color:#4b586b; padding:10px 28px; text-align:center;}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#222b3a; border-radius:4px;}
</style>
</head>
<body>
<div id="app">

  <!-- MAIN MENU -->
  <div class="screen active" id="screen-menu">
    <div class="topbar">
      <div class="brand">GOL<span>DRAGON</span></div>
      <button class="iconbtn" data-goto="settings" id="btn-settings-top"></button>
    </div>
    <div class="center">
      <h1 class="hero" id="txt-title">GolDragon<span class="sub" id="txt-tagline">TACTICAL 3D ARENA — ONLINE 1v1</span></h1>
      <div class="menuBtns">
        <button class="bigbtn primary" id="btn-play"></button>
        <button class="bigbtn" id="btn-howto"></button>
      </div>
      <p style="color:var(--sub); font-size:12px; max-width:420px;" id="txt-onlineNote1"></p>
    </div>
    <footer class="credit" id="txt-credit"></footer>
  </div>

  <!-- ONLINE LOBBY -->
  <div class="screen" id="screen-lobby">
    <div class="topbar">
      <div class="brand" id="txt-lobbyTitle"></div>
      <button class="iconbtn" data-goto="menu" id="txt-back5"></button>
    </div>
    <div class="center">
      <div id="lobbyConnectForm" style="width:min(360px,86vw); display:flex; flex-direction:column; gap:14px;">
        <div class="fieldLabel" id="txt-serverUrlLabel"></div>
        <input type="text" class="txtfield" id="inp-serverUrl" placeholder="wss://mon-serveur.onrender.com" autocomplete="off">
        <div class="fieldLabel" id="txt-roomCodeLabel"></div>
        <input type="text" class="txtfield" id="inp-roomCode" placeholder="ex: ABCD" autocomplete="off" maxlength="12" style="text-transform:uppercase;">
        <button class="bigbtn primary" id="btn-connect"></button>
        <p style="color:var(--sub); font-size:12px;" id="txt-onlineNote2"></p>
      </div>
      <div id="lobbyStatusWrap" style="display:none;">
        <p id="lobbyStatus" style="font-size:18px;"></p>
        <p id="lobbyRole" style="color:var(--accent); font-size:15px; font-weight:600;"></p>
        <p id="lobbyRoomCode" style="color:var(--sub); font-size:13px;"></p>
      </div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="screen" id="screen-settings">
    <div class="topbar">
      <div class="brand" id="txt-settingsTitle"></div>
      <button class="iconbtn" data-goto="menu" id="txt-back1"></button>
    </div>
    <div class="center">
      <p class="sectionTitle" id="txt-langLabel"></p>
      <div class="langRow">
        <button class="langChip" data-lang="fr">Français</button>
        <button class="langChip" data-lang="en">English</button>
        <button class="langChip" data-lang="zh">中文</button>
        <button class="langChip" data-lang="he">עברית</button>
      </div>
      <p style="color:var(--sub); font-size:13px; max-width:420px;" id="txt-langNote"></p>

      <p class="sectionTitle" id="txt-controlsLabel" style="margin-top:22px;"></p>
      <div id="controlsList" style="display:flex; flex-direction:column; gap:8px; width:min(520px,90vw);"></div>
      <button class="iconbtn" id="btn-resetControls" style="margin-top:6px;"></button>
    </div>
  </div>

  <!-- HOW TO -->
  <div class="screen" id="screen-howto">
    <div class="topbar">
      <div class="brand" id="txt-howtoTitle"></div>
      <button class="iconbtn" data-goto="menu" id="txt-back2"></button>
    </div>
    <div class="center" style="align-items:stretch; max-width:640px; margin:0 auto;">
      <div class="wRow" style="justify-content:space-between;">
        <b class="pickTag p1" id="txt-p1label"></b>
        <span id="txt-ctrlP1" style="font-size:13px;color:var(--sub)"></span>
      </div>
      <p style="color:var(--sub); font-size:13px;" id="txt-onlineNote3"></p>
    </div>
  </div>

  <!-- AGENT SELECT -->
  <div class="screen" id="screen-agents">
    <div class="topbar">
      <div class="brand" id="txt-agentTitle"></div>
      <button class="iconbtn" data-goto="menu" id="txt-back3"></button>
    </div>
    <div class="grid agentGrid" id="agentGrid"></div>
    <div class="pickRow">
      <span class="pickTag p1" id="pickP1"></span>
      <span class="pickTag p2" id="pickP2"></span>
      <span class="spacer"></span>
      <span id="agentWaitNote" style="color:var(--sub); font-size:13px;"></span>
      <button class="bigbtn primary" id="btn-toMaps" disabled></button>
    </div>
  </div>

  <!-- MAP SELECT -->
  <div class="screen" id="screen-maps">
    <div class="topbar">
      <div class="brand" id="txt-mapTitle"></div>
      <button class="iconbtn" data-goto="agents" id="txt-back4"></button>
    </div>
    <div class="grid mapGrid" id="mapGrid"></div>
    <div class="pickRow">
      <span class="spacer"></span>
      <span id="mapWaitNote" style="color:var(--sub); font-size:13px;"></span>
      <button class="bigbtn primary" id="btn-toGame" disabled></button>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="screen-game">
    <div id="viewport"></div>
    <div class="hud">
      <div class="divider"></div>
      <div class="hudSide left">
        <div class="pName" id="hud-p1name" style="color:var(--p1)"></div>
        <div class="hpWrap"><div class="hpBarBg"><div class="hpBarFill" id="hp1" style="width:100%"></div></div><div class="hpNum" id="hp1n">100</div></div>
        <div class="wpInfo" id="hud-p1weapon"></div>
        <div class="abilBox" id="hud-p1ability" style="color:var(--p1)"></div>
      </div>
      <div class="hudSide right">
        <div class="pName" id="hud-p2name" style="color:var(--p2)"></div>
        <div class="hpWrap"><div class="hpBarBg"><div class="hpBarFill" id="hp2" style="width:100%"></div></div><div class="hpNum" id="hp2n">100</div></div>
        <div class="wpInfo" id="hud-p2weapon"></div>
        <div class="abilBox" id="hud-p2ability" style="color:var(--p2)"></div>
      </div>
      <div class="centerHud">
        <div class="scoreRow"><span class="p1t" id="score1">0</span> : <span class="p2t" id="score2">0</span></div>
        <div class="roundMsg" id="roundLabel"></div>
      </div>
    </div>
    <div class="overlayMsg" id="overlay" style="display:none;">
      <div class="big" id="overlayBig"></div>
      <div id="overlaySmall" style="color:var(--sub);font-size:16px;"></div>
    </div>
    <div class="buyBar" id="buyBar" style="display:none;">
      <div class="buyCol">
        <div class="t" style="color:var(--p1)" id="buyLabel1"></div>
        <div class="buyList" id="buyList1"></div>
      </div>
      <div class="buyCol">
        <div class="t" style="color:var(--p2)" id="buyLabel2"></div>
        <div class="buyList" id="buyList2"></div>
      </div>
    </div>
  </div>

</div>

/* ================= ONLINE ROOM (serveur WebSocket dédié) ================= */
let room = null;
let myRole = null; // 'host' | 'guest' | null
let matchStarted = false;
let lastProcessedGuestBuy = null;

// Petit shim qui reproduit l'API room.* (peers/onPeers/on/presence/emit)
// par-dessus une simple connexion WebSocket vers un serveur relais dédié.
function connectWSRoom(serverUrl, roomCode){
  return new Promise((resolve)=>{
    let ws;
    try{ ws = new WebSocket(serverUrl); }catch(e){ resolve(null); return; }
    const myId = Math.random().toString(36).slice(2) + Date.now().toString(36);
    let peersList = [{peer:myId, kind:'viewer', isMe:true, presence:{}}];
    let peersCb = null;
    const eventCbs = {};
    let settled = false;
    const failTimer = setTimeout(()=>{ if(!settled){ settled=true; resolve(null); } }, 8000);
    ws.addEventListener('open', ()=>{
      ws.send(JSON.stringify({type:'join', code:roomCode, id:myId}));
      if(!settled){
        settled = true; clearTimeout(failTimer);
        resolve({
          peers: ()=>peersList,
          onPeers: (cb)=>{ peersCb = cb; },
          on: (event,cb)=>{ (eventCbs[event]=eventCbs[event]||[]).push(cb); },
          presence: (data)=>{ try{ ws.send(JSON.stringify({type:'presence', data})); }catch(e){} },
          emit: (event,data)=>{ try{ ws.send(JSON.stringify({type:'emit', event, data})); }catch(e){} },
        });
      }
    });
    ws.addEventListener('message', (ev)=>{
      let msg; try{ msg = JSON.parse(ev.data); }catch(e){ return; }
      if(msg.type==='peers'){
        peersList = (msg.peers||[]).map(p=>({peer:p.id, kind:'viewer', isMe:p.id===myId, presence:p.presence||{}}));
        if(peersCb) peersCb();
      } else if(msg.type==='event'){
        (eventCbs[msg.event]||[]).forEach(fn=>fn({data:msg.data}));
      }
    });
    ws.addEventListener('close', ()=>{
      if(!settled){ settled=true; clearTimeout(failTimer); resolve(null); return; }
      peersList = peersList.filter(p=>p.isMe);
      if(peersCb) peersCb();
    });
    ws.addEventListener('error', ()=>{ if(!settled){ settled=true; clearTimeout(failTimer); resolve(null); } });
  });
}

async function initRoom(serverUrl, roomCode){
  room = await connectWSRoom(serverUrl, roomCode);
  if(!room){ renderLobbyStatus('failed'); return; }
  room.onPeers(()=>{
    if(matchStarted){
      const opp = opponentPeer();
      if(!opp && (matchState==='fight'||matchState==='buy')){
        document.getElementById('roundLabel').textContent = t('opponentDisconnected');
        setTimeout(()=>{
          showScreen('menu'); matchStarted=false; matchState='idle';
          if(animHandle){ cancelAnimationFrame(animHandle); animHandle=null; }
        }, 1800);
      }
      return;
    }
    onRoomPeersChange();
    if(myRole==='host' && matchState==='buy'){
      const opp = opponentPeer();
      const bw = opp && opp.presence ? opp.presence.buyWant : null;
      if(bw!=null && bw!==lastProcessedGuestBuy){
        lastProcessedGuestBuy = bw;
        const w = WEAPONS[bw];
        if(w && w.cost<=state.credits2){ state.credits2-=w.cost; state.weapon2=bw; renderBuyBar(); }
      }
    }
  });
  room.on('matchStart', msg=>{
    if(myRole==='guest' && msg.data) guestStartMatch(msg.data);
  });
  onRoomPeersChange();
}

function viewerPeers(){ return room ? room.peers().filter(p=>p.kind==='viewer') : []; }
function sortedViewerPeers(){
  return [...viewerPeers()].sort((a,b)=> a.peer<b.peer?-1:(a.peer>b.peer?1:0));
}
function computeRole(){
  const sorted = sortedViewerPeers();
  if(sorted.length<2) return null;
  const me = sorted.find(p=>p.isMe);
  if(!me) return null;
  const idx = sorted.findIndex(p=>p.peer===me.peer);
  return idx===0 ? 'host' : (idx===1 ? 'guest' : 'spectator');
}
function opponentPeer(){
  const sorted = sortedViewerPeers();
  const me = sorted.find(p=>p.isMe);
  if(!me) return null;
  return sorted.find(p=>p.peer!==me.peer) || null;
}
function onRoomPeersChange(){
  if(matchStarted) return;
  myRole = computeRole();
  renderLobbyStatus();
  if(document.getElementById('screen-agents').classList.contains('active')){
    syncPicksFromPresence(); renderAgentGrid(); updatePickTags();
  }
}

    formWrap.style.display='flex'; statusWrap.style.display='none';
    statusEl.textContent = ''; // affiché en alert ci-dessous via btn-connect
    alert(t('connectFailed'));

  if(mode==='connecting'){
    formWrap.style.display='none'; statusWrap.style.display='block';
    statusEl.textContent = t('connecting'); roleEl.textContent=''; codeEl.textContent='';
    return;
  }
  if(!room){ formWrap.style.display='flex'; statusWrap.style.display='none'; return; }
  formWrap.style.display='none'; statusWrap.style.display='block';
  codeEl.textContent = t('roomCodeIs') + ' ' + (lastRoomCode||'');
  if(myRole==='host' || myRole==='guest'){

function buildScene(mapDef){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(mapDef.sky);
  scene.fog = new THREE.Fog(mapDef.sky, 25, 60);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x222233, 1.1);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 0.7);
  dir.position.set(10,20,10);
  scene.add(dir);

  const groundGeo = new THREE.PlaneGeometry(ARENA*2, ARENA*2);
  const groundMat = new THREE.MeshStandardMaterial({color:mapDef.ground, roughness:0.9});
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  const gridHelper = new THREE.GridHelper(ARENA*2, 20, 0xffffff, 0xffffff);
  gridHelper.material.opacity = 0.06; gridHelper.material.transparent = true;
  scene.add(gridHelper);

  // boundary walls
  mapWalls = [];
  const boundaryMat = new THREE.MeshStandardMaterial({color:0x1b2230, roughness:0.8});
  [[0,ARENA,ARENA*2,0.6],[0,-ARENA,ARENA*2,0.6],[ARENA,0,0.6,ARENA*2],[-ARENA,0,0.6,ARENA*2]].forEach(([x,z,w,d])=>{
    const h=4;
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), boundaryMat);
    mesh.position.set(x,h/2,z);
    scene.add(mesh);
    mapWalls.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2});
  });

  const wallMat = new THREE.MeshStandardMaterial({color:0x2e3648, roughness:0.7});
  mapDef.walls.forEach(w=>{
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w.w, w.h, w.d), wallMat);
    mesh.position.set(w.x, w.h/2, w.z);
    scene.add(mesh);
    mapWalls.push({minX:w.x-w.w/2,maxX:w.x+w.w/2,minZ:w.z-w.d/2,maxZ:w.z+w.d/2});
  });
}

function makePlayerMesh(color){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,1.6,10),
    new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.25}));
  body.position.y = 1.0;
  g.add(body);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.22,0.5,8), new THREE.MeshStandardMaterial({color:0xffffff}));
  nose.rotation.x = Math.PI/2;
  nose.position.set(0,1.0,0.55);
  g.add(nose);
  return g;
}

/* ---- collision helpers ---- */
function collides(x,z, exclude){
  const r=0.5;
  for(const w of mapWalls){
    if(x+r>w.minX && x-r<w.maxX && z+r>w.minZ && z-r<w.maxZ) return true;
  }
  for(const tw of tempWalls){
    if(x+r>tw.minX && x-r<tw.maxX && z+r>tw.minZ && z-r<tw.maxZ) return true;
  }
  return false;
}

/* ---- abilities ---- */
function useAbility(pKey){
  const p = players[pKey];
  const o = players[pKey==='p1'?'p2':'p1'];
  if(matchState!=='fight' || !p.alive) return;
  if(p.cooldownAbility>0) return;
  const type = p.agent.ability;
  const now = performance.now();
  switch(type){
    case 'dash':
      p.dashUntil = now+400; p.cooldownAbility=6;
      break;
    case 'teleport': {
      const dx = Math.sin(p.rot)*9, dz = Math.cos(p.rot)*9;
      const nx = clampArena(p.x+dx), nz = clampArena(p.z+dz);
      if(!collides(nx,nz)){ p.x=nx; p.z=nz; }
      p.cooldownAbility=7;
      break;
    }
    case 'dmgboost':
      p.dmgBoostNext = true; p.cooldownAbility=8;
      break;
    case 'overcharge':
      p.overchargeUntil = now+4000; p.cooldownAbility=9;
      break;
    case 'shield':
      p.shield = 50; p.cooldownAbility=8;
      break;
    case 'heal':
      p.hp = Math.min(100, p.hp+40); p.cooldownAbility=8; updateHpHud();
      break;
    case 'invis':
      p.invisUntil = now+3500; p.cooldownAbility=9;
      break;
    case 'speedtrap':
    case 'slow':
      o.speedMul = 0.5; o.speedMulUntil = now+(type==='slow'?4000:3000); p.cooldownAbility=8;
      break;
    case 'wall': {
      const dx = Math.sin(p.rot)*3, dz = Math.cos(p.rot)*3;
      const wx = p.x+dx, wz = p.z+dz;
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(3.5,3,0.6), new THREE.MeshStandardMaterial({color:0x8b5cf6, transparent:true, opacity:0.6, emissive:0x8b5cf6, emissiveIntensity:0.3}));
      mesh.position.set(wx,1.5,wz); mesh.rotation.y = p.rot;
      scene.add(mesh);
      const cos=Math.cos(p.rot), sin=Math.sin(p.rot);
      const hw = Math.abs(cos)*1.75+Math.abs(sin)*0.3, hd = Math.abs(sin)*1.75+Math.abs(cos)*0.3;
      const tw = {mesh, minX:wx-hw,maxX:wx+hw,minZ:wz-hd,maxZ:wz+hd, until:now+6000};
      tempWalls.push(tw);
      p.cooldownAbility=10;
      break;
    }
    case 'orb': {
      const dir = {x:Math.sin(p.rot), z:Math.cos(p.rot)};
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.25,8,8), new THREE.MeshStandardMaterial({color:0xf43f5e, emissive:0xf43f5e, emissiveIntensity:0.6}));
      mesh.position.set(p.x,1.1,p.z);
      scene.add(mesh);
      orbs.push({mesh, x:p.x, z:p.z, dx:dir.x, dz:dir.z, owner:pKey, life:2.0});
      p.cooldownAbility=7;
      break;
    }
    case 'reveal':
      o.revealedUntil = now+4000; p.cooldownAbility=9;
      break;
  }
}
function clampArena(v){ return Math.max(-ARENA+1, Math.min(ARENA-1, v)); }

/* ---- shooting ---- */
function tryShoot(pKey){
  const p = players[pKey];
  const o = players[pKey==='p1'?'p2':'p1'];
  if(matchState!=='fight' || !p.alive) return;
  const now = performance.now();
  const w = WEAPONS[p.weapon];
  let rate = w.rate;
  if(p.overchargeUntil>now) rate = rate/2;
  if(now - p.lastShot < rate) return;
  p.lastShot = now;

  const dirx = Math.sin(p.rot), dirz = Math.cos(p.rot);
  const ox = p.x, oz = p.z;
  const tx = o.x-ox, tz = o.z-oz;
  const dist = Math.sqrt(tx*tx+tz*tz);
  // flash
  spawnMuzzleFlash(p);
  if(dist>w.range) return;
  const dot = (tx*dirx+tz*dirz)/(dist||1);
  const angle = Math.acos(Math.max(-1,Math.min(1,dot)));
  if(angle > 0.45) return; // ~26 degree cone, forgiving for keyboard-only aim
  // line of sight check against walls
  if(lineBlocked(ox,oz,o.x,o.z)) return;

  let dmg = w.dmg;
  if(p.dmgBoostNext){ dmg*=2; p.dmgBoostNext=false; }
  applyDamage(o, dmg);
}
function lineBlocked(x1,z1,x2,z2){
  const steps=12;
  for(let i=1;i<steps;i++){
    const t=i/steps;
    const x=x1+(x2-x1)*t, z=z1+(z2-z1)*t;
    for(const w of mapWalls){ if(x>w.minX&&x<w.maxX&&z>w.minZ&&z<w.maxZ) return true; }
    for(const w of tempWalls){ if(x>w.minX&&x<w.maxX&&z>w.minZ&&z<w.maxZ) return true; }
  }
  return false;
}
function applyDamage(target, dmg){
  if(target.shield>0){
    const absorbed = Math.min(target.shield, dmg);
    target.shield -= absorbed; dmg -= absorbed;
  }
  target.hp -= dmg;
  updateHpHud();
  if(target.hp<=0 && target.alive){
    target.alive=false; target.hp=0;
    target.mesh.visible=false;
    updateHpHud();
    const winner = target===players.p1 ? 'p2' : 'p1';
    setTimeout(()=>endRound(winner), 300);
  }
}
function spawnMuzzleFlash(p){
  const dirx = Math.sin(p.rot), dirz = Math.cos(p.rot);
  const flash = new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6), new THREE.MeshBasicMaterial({color:0xffffaa}));
  flash.position.set(p.x+dirx*0.9, 1.1, p.z+dirz*0.9);
  scene.add(flash);
  setTimeout(()=>scene.remove(flash), 60);
}

function updateHpHud(){
  const p1=players.p1, p2=players.p2;
  document.getElementById('hp1').style.width = Math.max(0,p1.hp)+'%';
  document.getElementById('hp2').style.width = Math.max(0,p2.hp)+'%';
  document.getElementById('hp1n').textContent = Math.max(0,Math.round(p1.hp));
  document.getElementById('hp2n').textContent = Math.max(0,Math.round(p2.hp));
  document.getElementById('hud-p1weapon').textContent = WEAPONS[p1.weapon].name;
  document.getElementById('hud-p2weapon').textContent = WEAPONS[p2.weapon].name;
  const a1 = ABIL_TXT[p1.agent.ability], a2 = ABIL_TXT[p2.agent.ability];
  document.getElementById('hud-p1ability').textContent = (a1.name[LANG]||a1.name.en) + (p1.cooldownAbility>0?' ('+Math.ceil(p1.cooldownAbility)+'s)':' ✓');
  document.getElementById('hud-p2ability').textContent = (a2.name[LANG]||a2.name.en) + (p2.cooldownAbility>0?' ('+Math.ceil(p2.cooldownAbility)+'s)':' ✓');
}

/* ---- main loop ---- */
function loop(){
  animHandle = requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min(0.05,(now-lastTime)/1000);
  lastTime = now;

  if(myRole==='guest'){
    if(matchState==='fight' || matchState==='buy'){
      const c = CONTROLS.p1;
      const inp = {fwd:!!keys[c.fwd], back:!!keys[c.back], left:!!keys[c.left], right:!!keys[c.right], shoot:!!keys[c.shoot], ability:!!keys[c.ability]};
      if(room) room.presence({input: inp});
    }
    guestApplySnapshotFromHost();
  } else {
    // host (or local fallback): authoritative simulation
    if(matchState==='buy'){
      buyTimer -= dt;
      if(buyTimer<=0) beginFight();
    }
    if(matchState==='fight' || matchState==='buy'){
      updatePlayerControl('p1', dt, CONTROLS.p1);
      const opp = opponentPeer();
      const gi = (opp && opp.presence && opp.presence.input) || {};
      keys['RemoteFwd']=!!gi.fwd; keys['RemoteBack']=!!gi.back; keys['RemoteLeft']=!!gi.left;
      keys['RemoteRight']=!!gi.right; keys['RemoteShoot']=!!gi.shoot; keys['RemoteAbility']=!!gi.ability;
      updatePlayerControl('p2', dt, {fwd:'RemoteFwd',back:'RemoteBack',left:'RemoteLeft',right:'RemoteRight',shoot:'RemoteShoot',ability:'RemoteAbility'});
    }
    if(matchState==='fight'){
      updateCooldowns(dt);
      updateOrbs(dt);
      cleanupTempWalls();
    }
    if(matchStarted && room) hostBroadcastSnapshot();
  }

  // sync meshes
  ['p1','p2'].forEach(k=>{
    const p = players[k];
    if(!p) return;
    p.mesh.position.set(p.x,0,p.z);
    p.mesh.rotation.y = p.rot;
    const now2 = performance.now();
    const invisActive = p.invisUntil>now2;
    p.mesh.children[0].material.transparent = true;
    p.mesh.children[0].material.opacity = invisActive?0.25:1;
  });

  if(cam){
    const myP = (myRole==='guest') ? players.p2 : players.p1;
    updateChaseCam(cam, myP);
    renderSingle();
  }
}

function round2(v){ return Math.round(v*100)/100; }
function compactPlayer(p){
  return { x:round2(p.x), z:round2(p.z), r:round2(p.rot), hp:Math.round(p.hp), a:p.alive?1:0,
    sh:Math.round(p.shield||0), cd:Math.round((p.cooldownAbility||0)*10)/10,
    inv:(p.invisUntil>performance.now())?1:0, wp:p.weapon };
}
function hostBroadcastSnapshot(){
  const snap = {
    ms:matchState, w1:state.wins1, w2:state.wins2, c1:state.credits1, c2:state.credits2,
    wp1:state.weapon1, wp2:state.weapon2,
    p1:compactPlayer(players.p1), p2:compactPlayer(players.p2)
  };
  room.presence({state: snap});
}
function guestApplySnapshotFromHost(){
  const hostP = opponentPeer();
  if(!hostP || !hostP.presence || !hostP.presence.state) return;
  const snap = hostP.presence.state;
  if(snap.ms !== matchState){
    matchState = snap.ms;
    if(matchState==='buy'){
      document.getElementById('overlay').style.display='none';
      document.getElementById('buyBar').style.display='flex';
      document.getElementById('roundLabel').textContent = t('buyPhase');
    } else if(matchState==='fight'){
      document.getElementById('buyBar').style.display='none';
      document.getElementById('roundLabel').textContent = t('round')+' '+(snap.w1+snap.w2+1);
    } else if(matchState==='roundend' || matchState==='matchend'){
      document.getElementById('buyBar').style.display='none';
      document.getElementById('overlay').style.display='flex';
      document.getElementById('overlayBig').textContent = matchState==='matchend' ? t('matchWin') : t('roundWin');
      document.getElementById('overlaySmall').textContent = t('pressStart');
    }
  }
  state.wins1=snap.w1; state.wins2=snap.w2; state.credits1=snap.c1; state.credits2=snap.c2;
  state.weapon1=snap.wp1; state.weapon2=snap.wp2;
  if(snap.p1){ Object.assign(players.p1, {x:snap.p1.x,z:snap.p1.z,rot:snap.p1.r,hp:snap.p1.hp,alive:!!snap.p1.a,shield:snap.p1.sh,cooldownAbility:snap.p1.cd,weapon:snap.p1.wp,invisUntil:snap.p1.inv?performance.now()+200:0}); players.p1.mesh.visible=players.p1.alive; }
  if(snap.p2){ Object.assign(players.p2, {x:snap.p2.x,z:snap.p2.z,rot:snap.p2.r,hp:snap.p2.hp,alive:!!snap.p2.a,shield:snap.p2.sh,cooldownAbility:snap.p2.cd,weapon:snap.p2.wp,invisUntil:snap.p2.inv?performance.now()+200:0}); players.p2.mesh.visible=players.p2.alive; }
  updateScoreHud(); updateHpHud();
  if(matchState==='buy') renderBuyBar();
}

function updatePlayerControl(key, dt, map){
  const p = players[key];
  if(!p.alive) return;
  const turnSpeed = 2.6;
  if(keys[map.left]) p.rot += turnSpeed*dt;
  if(keys[map.right]) p.rot -= turnSpeed*dt;
  let speed = 5.2 * (p.speedMul||1);
  const now = performance.now();
  if(p.speedMulUntil && p.speedMulUntil<now) p.speedMul=1;
  if(p.dashUntil && p.dashUntil>now) speed*=2.2;
  let move=0;
  if(keys[map.fwd]) move=1;
  else if(keys[map.back]) move=-1;
  if(move!==0){
    const dx = Math.sin(p.rot)*move*speed*dt;
    const dz = Math.cos(p.rot)*move*speed*dt;
    const nx = clampArena(p.x+dx), nz = clampArena(p.z+dz);
    if(!collides(nx,p.z)) p.x=nx;
    if(!collides(p.x,nz)) p.z=nz;
  }
  if(keys[map.shoot]) tryShoot(key);
  if(keys[map.ability]){ useAbility(key); keys[map.ability]=false; }
}
function updateCooldowns(dt){
  ['p1','p2'].forEach(k=>{
    const p=players[k];
    if(p.cooldownAbility>0) p.cooldownAbility=Math.max(0,p.cooldownAbility-dt);
  });
  updateHpHud();
}
function updateOrbs(dt){
  for(let i=orbs.length-1;i>=0;i--){
    const o = orbs[i];
    o.life -= dt;
    o.x += o.dx*10*dt; o.z += o.dz*10*dt;
    o.mesh.position.set(o.x,1.1,o.z);
    const target = players[o.owner==='p1'?'p2':'p1'];
    const dist = Math.hypot(target.x-o.x, target.z-o.z);
    let hit=false;
    if(dist<0.8 && target.alive){ applyDamage(target,35); hit=true; }
    for(const w of mapWalls){ if(o.x>w.minX&&o.x<w.maxX&&o.z>w.minZ&&o.z<w.maxZ) hit=true; }
    if(hit || o.life<=0){ scene.remove(o.mesh); orbs.splice(i,1); }
  }
}
function cleanupTempWalls(){
  const now = performance.now();
  for(let i=tempWalls.length-1;i>=0;i--){
    if(tempWalls[i].until<now){ scene.remove(tempWalls[i].mesh); tempWalls.splice(i,1); }
  }
}

function updateChaseCam(cam, p){
  const backDist=4.6, height=2.6;
  const bx = p.x - Math.sin(p.rot)*backDist;
  const bz = p.z - Math.cos(p.rot)*backDist;
  cam.position.lerp(new THREE.Vector3(bx,height,bz), 0.25);
  const lookAt = new THREE.Vector3(p.x + Math.sin(p.rot)*3, 1.1, p.z + Math.cos(p.rot)*3);
  cam.lookAt(lookAt);
}
function renderSingle(){
  const vp = document.getElementById('viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const size = renderer.getSize(new THREE.Vector2());
  if(size.x !== W || size.y !== H) renderer.setSize(W,H);
  cam.aspect = W/H; cam.updateProjectionMatrix();
  renderer.setScissorTest(false);
  renderer.render(scene,cam);
}

/* ================= INIT ================= */
applyStaticTexts();
</script>
